user_prompt: |
  You are given the initial state of a robot task, the high-level goal, and one subgoal to expand.

  High-level goal: {goal}
  Visible/annotated objects: {objects}

  Subgoals for this task (for context):
  {subgoal_list}

  Subgoal to expand ({subgoal_index} of {subgoal_total}): {subgoal}

  Expand this subgoal into the ordered low-level robot actions needed to accomplish it.
  Generate only the actions for this subgoal, not for the other subgoals.

  Requirements:
  - Use concrete object names from the scene.
  - Avoid hallucinating objects that are not visible or named.
  - Keep actions consistent with preceding subgoals (assume they have already been executed).
  - Return only a numbered list of low-level actions for this subgoal.
