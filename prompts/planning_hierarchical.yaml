user_prompt: |
  You are given the initial state of a robot task and a high-level goal.

  Goal: {goal}
  Visible/annotated objects: {objects}

  First decompose the task into major subgoals. Then expand each subgoal into executable robot actions.

  Requirements:
  - Plan future actions; do not summarize the video.
  - Use concrete object names.
  - Avoid hallucinating objects that are not visible or named.
  - Return valid JSON in this format:
    {{
      "subgoals": [
        {{
          "subgoal": "...",
          "steps": ["...", "..."]
        }}
      ]
    }}
