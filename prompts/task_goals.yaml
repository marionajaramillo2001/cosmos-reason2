#
# Guidelines while writing:
#   - Describe the OUTCOME, not the steps.
#   - Preserve object counts ("five bottles", "two popcorn buckets").
#   - Don't prescribe which arm does what.
#   - Don't list subgoals in order.
#   - One sentence, <= ~25 words.

